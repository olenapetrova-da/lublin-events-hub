name: Sync docs to Notion

on:
  push:
    branches: [ main ]
    paths:
      - "docs/adr/**"
      - "docs/architecture/**"
      - "docs/strategy/**"
      - ".github/workflows/notion-docs-sync.yml"
      - "scripts/notion-sync.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: node scripts/notion-sync.js
        name: ADRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DOCS_ROOT: docs/adr/
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          # Notion recommends versioned requests; adjust if needed.
          NOTION_VERSION: "2025-09-03"
          FULL_SYNC: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}

      - run: node scripts/notion-sync.js
        name: architecture
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DOCS_ROOT: docs/architecture/
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID_ARCH }}
          # Notion recommends versioned requests; adjust if needed.
          NOTION_VERSION: "2025-09-03"
          FULL_SYNC: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}

      - run: node scripts/notion-sync.js
        name: strategy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DOCS_ROOT: docs/strategy/
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID_STRAT }}
          # Notion recommends versioned requests; adjust if needed.
          NOTION_VERSION: "2025-09-03"
          FULL_SYNC: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
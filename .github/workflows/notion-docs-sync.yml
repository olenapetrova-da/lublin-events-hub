name: Sync docs to Notion

on:
  push:
    branches: [ main ]
    paths:
      - "docs/adr/**"
      - "docs/architecture/**"
      - "docs/strategy/**"
      - ".github/workflows/notion-docs-sync.yml"
      - "scripts/notion-sync.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate ADR index
        run: node scripts/generate-adr-index.js
        env:
          DOCS_ROOT: docs/adr
      
      - name: Commit ADR index if changed
        run: |
          if ! git diff --quiet -- docs/adr/ADR-0000-index.md; then
            echo "ADR index changed; committing..."
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/adr/ADR-0000-index.md
            git commit -m "chore: update ADR index"
            git push
          else
            echo "ADR index unchanged; nothing to commit."
          fi

    
      - run: node scripts/notion-sync.js
        name: adr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DOCS_ROOT: docs/adr/
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID_ADR }}
          NOTION_VERSION: "2025-09-03"
          FULL_SYNC: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          # New: LEH versions DB mapping for "Applies to"
          NOTION_LEH_VERSIONS_DB_ID: ${{ secrets.NOTION_LEH_VERSIONS_DB_ID }}
          # Optional: only if the title property in LEH versions DB is NOT "Name"
          # NOTION_LEH_VERSIONS_NAME_PROP: "Name"


      - run: node scripts/notion-sync.js
        name: architecture
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DOCS_ROOT: docs/architecture/
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID_ARCH }}
          # Notion recommends versioned requests; adjust if needed.
          NOTION_VERSION: "2025-09-03"
          FULL_SYNC: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}

      - run: node scripts/notion-sync.js
        name: strategy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DOCS_ROOT: docs/strategy/
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID_STRAT }}
          # Notion recommends versioned requests; adjust if needed.
          NOTION_VERSION: "2025-09-03"
          FULL_SYNC: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}